<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    body { margin: 0; }
    #main { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #262824; }
    .clip { position: absolute; }
    #note { left: 180px; top: 350px; width: 650px; color: #eeeae0; font: 64px sans-serif; line-height: 1.3; }
    #note::before { content: ""; display: block; width: 6px; height: 60px; background: #a45d46; margin-bottom: 32px; }
    #caption { left: 180px; top: 960px; width: 550px; color: white; text-align: center; font: bold 72px sans-serif; }
    #caption span { color: #ffff00; }
  </style>
</head>
<body>
  <main id="main" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
    <div id="note" class="clip" data-start="0" data-duration="4" data-track-index="1">Storyboard placeholder</div>
    <div id="caption" class="clip" data-start="0" data-duration="4" data-track-index="2">Review <span>every</span> word</div>
  </main>
  <script>
    window.__timelines = window.__timelines || {};
    const timeline = gsap.timeline({ paused: true });
    timeline.fromTo("#note", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6 }, 0.2);
    window.__timelines.main = timeline;
  </script>
</body>
</html>
